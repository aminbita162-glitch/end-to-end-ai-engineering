<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Engineering Atlas — Amin Azimi</title>
  <desc id="hero-desc">Engineering atlas hero showing identity text and a restrained architectural signal path with 13 system nodes grouped by category, connected by evidence trails.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; }
