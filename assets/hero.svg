  <line x1="280" y1="156" x2="280" y2="186" stroke="#7093C3" stroke-width="0.6" opacity="0.3" stroke-dasharray="3 3" />
  <line x1="220" y1="206" x2="220" y2="236" stroke="#7093C3" stroke-width="0.6" opacity="0.3" stroke-dasharray="3 3" />
  <line x1="220" y1="256" x2="220" y2="286" stroke="#7093C3" stroke-width="0.6" opacity="0.3" stroke-dasharray="3 3" />

