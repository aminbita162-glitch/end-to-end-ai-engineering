  <line x1="350" y1="296" x2="390" y2="296" stroke="#7093C3" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3" />
  <line x1="410" y1="296" x2="450" y2="296" stroke="#7093C3" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3" />
